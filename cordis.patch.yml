# dsh-vision-helper bundle layer: inserted when a profile lists this bundle in
# dsh.profile.bundles (via `dsh plugin --profile <name> add dsh-vision-helper`).
# The row references the package by name so Node module resolution finds the
# installed package. Later layers (the profile's own cordis.patch.yml, --patch
# overlays) can override this row by id.
- insert:
    - id: dsh-vision-helper
      name: dsh-vision-helper
